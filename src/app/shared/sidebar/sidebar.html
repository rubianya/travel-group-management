<div class="sidebar" [class.mini]="!layoutService.isSidebarOpen()">

        @if(role === 'Admin') {
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active" matTooltip="Dashboard">
                <mat-icon matListItemIcon>dashboard</mat-icon>
                <span matListItemTitle class="sidebar-text">Dashboard</span>
        </a>
        <a mat-list-item routerLink="/users" routerLinkActive="active" matTooltip="Users">
                <mat-icon matListItemIcon>people</mat-icon>
                <span matListItemTitle class="sidebar-text">User Management</span>
        </a>
        <a mat-list-item routerLink="/interests" routerLinkActive="active" matTooltip="Categories">
                <mat-icon matListItemIcon>category</mat-icon>
                <span matListItemTitle class="sidebar-text">Category Management</span>
        </a>
        <a mat-list-item routerLink="/trips" routerLinkActive="active" matTooltip="Trips">
                <mat-icon matListItemIcon>flight</mat-icon>
                <span matListItemTitle class="sidebar-text">Trip</span>
        </a>
        }

        @if(role === 'Organizer') {
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active" matTooltip="Dashboard">
                <mat-icon matListItemIcon>dashboard</mat-icon>
                <span matListItemTitle class="sidebar-text">Dashboard</span>
        </a>
        <a mat-list-item routerLink="/trips" routerLinkActive="active" matTooltip="Trips">
                <mat-icon matListItemIcon>flight</mat-icon>
                <span matListItemTitle class="sidebar-text">Trip Management</span>
        </a>

        }

        @if(role === 'Traveler') {
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active" matTooltip="Dashboard">
                <mat-icon matListItemIcon>dashboard</mat-icon>
                <span matListItemTitle class="sidebar-text">Dashboard</span>
        </a>
        <a mat-list-item routerLink="/trips" routerLinkActive="active" matTooltip="Trips">
                <mat-icon matListItemIcon>flight</mat-icon>
                <span matListItemTitle class="sidebar-text">Trip</span>
        </a>
        <a mat-list-item routerLink="/my-registrations" routerLinkActive="active" matTooltip="Registrations">
                <mat-icon matListItemIcon>person_add</mat-icon>
                <span matListItemTitle class="sidebar-text">My Registration</span>
        </a>
        }
</div>
