<div class="trip-list-container">

  <div class="trip-list-header">
    <h2 class="trip-list-title">จัดการทริปท่องเที่ยว</h2>
    <button mat-flat-button color="primary" routerLink="/trips/new">
      <mat-icon>add</mat-icon> สร้างทริปใหม่
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="50" color="primary"></mat-spinner>
    <p>กำลังโหลดข้อมูล...</p>
  </div>

  <div class="table-container" *ngIf="!isLoading">
    <table mat-table [dataSource]="dataTrips" class="full-width-table">

      <ng-container matColumnDef="tripName">
        <th mat-header-cell *matHeaderCellDef> ชื่อทริป </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.tripName}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef> จังหวัด / สถานที่ </th>
        <td mat-cell *matCellDef="let element"> {{element.location}} </td>
      </ng-container>

      <ng-container matColumnDef="startDate">
        <th mat-header-cell *matHeaderCellDef> วันที่เริ่ม </th>
        <td mat-cell *matCellDef="let element"> {{element.startDate}} </td>
      </ng-container>

      <ng-container matColumnDef="endDate">
        <th mat-header-cell *matHeaderCellDef> วันที่สิ้นสุด </th>
        <td mat-cell *matCellDef="let element"> {{element.endDate}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> สถานะ </th>
        <td mat-cell *matCellDef="let element">
          <span class="status-badge status-{{ element.status?.toLowerCase() }}">
            {{element.status}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>จัดการ</th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="onViewDetail(element.id)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="onUpdate(element.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(element.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
