<div class="itinerary-list-container">

  <!-- ส่วนหัวข้อและปุ่มเพิ่มกิจกรรม -->
  <div class="itinerary-list-header">
    <h2 class="itinerary-list-title">กำหนดการเดินทาง (Trip #{{currentTripId}})</h2>

    <button mat-flat-button color="primary">
      <mat-icon>add</mat-icon> เพิ่มกิจกรรม
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="50" color="primary"></mat-spinner>
    <p>กำลังโหลดกำหนดการ...</p>
  </div>

  <!-- การ์ดแสดงรายการกำหนดการ -->
  <mat-card class="itinerary-list-card" *ngIf="!isLoading">
    <mat-card-content class="itinerary-list-card-content">

      <!-- วนลูปข้อมูลทั้งหมดที่เรียงลำดับมาแล้ว -->
      <div *ngFor="let item of itineraries; let i = index">

        <!-- แถบหัวข้อแสดง วันที่ (แสดงเฉพาะกิจกรรมแรกของวันนั้นๆ) -->
        <div *ngIf="i === 0 || itineraries[i-1].dayNo !== item.dayNo" class="itinerary-list-day-header"
          [style.border-top]="i === 0 ? 'none' : '1px solid #d9e2ec'">
          วันที่ {{ item.dayNo }}
        </div>

        <!-- รายละเอียดกิจกรรม -->
        <div class="itinerary-list-item">
          <!-- เวลา -->
          <div class="itinerary-list-time">
            {{ item.time }}
          </div>

          <!-- ชื่อกิจกรรมและสถานที่ -->
          <div class="itinerary-list-details">
            <div class="itinerary-list-item-title">{{ item.title }}</div>
            <div class="itinerary-list-location">
              <mat-icon class="itinerary-list-icon">location_on</mat-icon>
              {{ item.location }}
            </div>
          </div>

          <!-- ปุ่มแก้ไข/ลบ (รอพัฒนาต่อ) -->
          <div>
            <button mat-icon-button color="primary" title="แก้ไขกิจกรรม">
              <mat-icon>edit</mat-icon>
            </button>
          </div>
        </div>

        <!-- เส้นแบ่งระหว่างกิจกรรมในวันเดียวกัน -->
        <mat-divider *ngIf="i !== itineraries.length - 1 && itineraries[i+1].dayNo === item.dayNo"></mat-divider>

      </div>

    </mat-card-content>
  </mat-card>

</div>
