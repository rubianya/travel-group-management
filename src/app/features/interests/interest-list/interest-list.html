<div class="interest-list-container">
  <div class="interest-list-header">
    <h2 class="interest-list-title">จัดการประเภทความสนใจ</h2>
    <button mat-flat-button color="primary" (click)="onCreate()">
      <mat-icon>add</mat-icon> สร้างประเภทใหม่
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="50" color="primary"></mat-spinner>
    <p>กำลังโหลดข้อมูล...</p>
  </div>

  <div class="card-container" *ngIf="!isLoading">
    <table mat-table [dataSource]="interests" class="full-width-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> รหัส </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> ชื่อประเภท </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.interestName}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef> สถานะ </th>
        <td mat-cell *matCellDef="let element">
          <mat-slide-toggle [checked]="element.active === 'A'" (change)="onToggleStatus(element)" color="primary">
            {{element.active === 'A' ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}}
          </mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> จัดการ </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="onEdit(element.id)" title="แก้ไข">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(element.id)" title="ลบ">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center p-4" colspan="5">ไม่พบข้อมูลประเภทความสนใจ</td>
      </tr>
    </table>
  </div>
</div>
