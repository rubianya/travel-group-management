<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-mark">✈</div>
      <h2>เข้าสู่ระบบ</h2>
      <p>Travel Group Management System</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">อีเมล</label>
        <input type="email" id="email" formControlName="email" placeholder="กรอกอีเมล" class="form-control">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger">
          กรุณากรอกอีเมลให้ถูกต้อง
        </div>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" formControlName="password" placeholder="กรอกรหัสผ่าน" class="form-control">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger">
          กรุณากรอกรหัสผ่าน
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ' }}
      </button>
    </form>
  </div>
</div>
