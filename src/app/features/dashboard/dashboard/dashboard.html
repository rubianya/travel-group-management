<div class="dashboard-container">

  <div class="dashboard-header">
    <div class="dashboard-title-row">
      <div>
        <h2 class="dashboard-title">ภาพรวมระบบ (Dashboard)</h2>
        <p class="dashboard-subtitle">ยินดีต้อนรับ! ข้อมูลในหน้านี้จะแสดงตามสิทธิ์การใช้งานของคุณ</p>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="50" color="primary"></mat-spinner>
    <p>กำลังเตรียมความพร้อมหน้าจอ...</p>
  </div>

  <div *ngIf="!isLoading">
    <app-admin-dashboard *ngIf="currentRole === 'Admin'"></app-admin-dashboard>
    <app-organizer-dashboard *ngIf="currentRole === 'Organizer'"></app-organizer-dashboard>
    <app-traveler-dashboard *ngIf="currentRole === 'Traveler'"></app-traveler-dashboard>
  </div>

</div>
