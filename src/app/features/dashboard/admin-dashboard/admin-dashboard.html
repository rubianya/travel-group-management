<!-- Loading State -->
<div class="loading-container" *ngIf="isLoading">
  <mat-spinner diameter="50" color="primary"></mat-spinner>
  <p>กำลังโหลดข้อมูลภาพรวมของระบบ...</p>
</div>

<div *ngIf="!isLoading">
  <!-- ส่วนที่ 1: การ์ดสรุปตัวเลข (Summary Cards) -->
  <div class="dashboard-grid">
    <!-- การ์ด: ข้อมูลทริป -->
    <mat-card class="dashboard-card-success">
      <mat-card-content class="dashboard-card-content">
        <div>
          <p class="dashboard-card-label">ทริปเปิดรับสมัคร / ทั้งหมด (ระบบ)</p>
          <h3 class="dashboard-card-value-container">
            <span class="dashboard-card-value-success">{{ tripStats.openTrips }}</span> <span
              class="dashboard-card-value-sub">/ {{ tripStats.totalTrips }}</span>
          </h3>
        </div>
        <div class="dashboard-icon-bg-success">
          <mat-icon class="dashboard-icon-success">flight_takeoff</mat-icon>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
