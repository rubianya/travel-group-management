<div class="container mt-4">
  <mat-card class="shadow-sm" *ngIf="!isLoading && user; else loading">
    <mat-card-header class="p-3 border-bottom d-flex justify-content-between align-items-center">
      <mat-card-title class="mb-0 fs-4 fw-bold">
        รายละเอียดผู้ใช้
      </mat-card-title>
      <div>
        <button mat-icon-button color="primary" routerLink="/users/{{ user.id }}" class="me-2" title="แก้ไข">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button routerLink="/users" title="ปิด">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </mat-card-header>

    <mat-card-content class="p-4">
      <div class="row mb-3">
        <div class="col-md-3 fw-bold text-muted">ID:</div>
        <div class="col-md-9">{{ user.id }}</div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold text-muted">ชื่อ - นามสกุล:</div>
        <div class="col-md-9">{{ user.fullName }}</div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold text-muted">อีเมล:</div>
        <div class="col-md-9">{{ user.email }}</div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold text-muted">บทบาท (Role):</div>
        <div class="col-md-9">
          <mat-chip-set>
            <mat-chip [color]="user.role === 'Admin' ? 'accent' : 'primary'" selected>
              {{ user.role }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold text-muted">สถานะ (Status):</div>
        <div class="col-md-9">
          <mat-chip-set>
            <mat-chip [color]="user.status === 'A' ? 'primary' : 'warn'" selected>
              {{ user.status }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3 fw-bold text-muted">เบอร์โทร:</div>
        <div class="col-md-9">
          {{ user.phone || '-' }}
        </div>
      </div>

    </mat-card-content>

    <mat-card-actions class="p-3 d-flex justify-content-end bg-light rounded-bottom">
      <button mat-stroked-button routerLink="/users">กลับสู่หน้ารายการ</button>
    </mat-card-actions>
  </mat-card>

  <ng-template #loading>
    <div class="text-center p-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2">กำลังโหลดข้อมูล...</p>
    </div>
  </ng-template>
</div>
