<div class="trip-list-container">

  <div class="trip-list-header">
    <h2 class="trip-list-title">จัดการข้อมูลผู้ใช้งาน (User Management)</h2>
    <button mat-flat-button color="primary" routerLink="/users/new">
      <mat-icon>person_add</mat-icon> เพิ่มผู้ใช้ใหม่
    </button>
  </div>

  <div class="loading-container" *ngIf="isLoading">
    <mat-spinner diameter="50" color="primary"></mat-spinner>
    <p>กำลังโหลดข้อมูล...</p>
  </div>

  <div class="table-container" *ngIf="!isLoading">
    <table mat-table [dataSource]="users" class="full-width-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef> ชื่อ - นามสกุล </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.fullName}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> อีเมล </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> บทบาท </th>
        <td mat-cell *matCellDef="let element">
          <span class="status-badge status-{{ element.role?.toLowerCase() }}">
            {{element.role}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> สถานะ </th>
        <td mat-cell *matCellDef="let element">
          <mat-slide-toggle
            [checked]="element.status === 'A'"
            (change)="toggleStatus(element.id, element.status)"
            color="primary">
            <span class="status-badge status-{{ element.status?.toLowerCase() }}">
              {{element.status === 'A' ? 'Active' : (element.status === 'I' ? 'Inactive' : element.status)}}
            </span>
          </mat-slide-toggle>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> จัดการ </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="onViewDetail(element.id)" title="ดูรายละเอียด">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="primary" (click)="onUpdate(element.id)" title="แก้ไข">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="onDelete(element.id)" title="ลบ">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Show when no data -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center p-4" colspan="6">ไม่พบข้อมูลผู้ใช้งาน</td>
      </tr>
    </table>
  </div>
</div>
