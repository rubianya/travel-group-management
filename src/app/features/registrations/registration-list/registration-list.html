<div class="registration-list-container" style="padding: 24px;">
  
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0;">รายชื่อผู้สมัครเข้าร่วมทริป</h2>

        <button mat-flat-button color="primary" routerLink="/registrations/new">
            <mat-icon>person_add</mat-icon> สร้างใบสมัคร
        </button>
    </div>

    <div style="overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <table mat-table [dataSource]="dataSource" style="width: 100%;">
            <ng-container matColumnDef="travelerName">
                <th mat-header-cell *matHeaderCellDef> ชื่อผู้สมัคร </th>
                <td mat-cell *matCellDef="let element"> <strong>{{element.travelerName}}</strong> </td>
            </ng-container>

            <ng-container matColumnDef="tripId">
                <th mat-header-cell *matHeaderCellDef> รหัสทริป </th>
                <td mat-cell *matCellDef="let element"> ทริป #{{element.tripId}} </td>
            </ng-container>

            <ng-container matColumnDef="budget">
                <th mat-header-cell *matHeaderCellDef> งบประมาณ (บาท) </th>
                <td mat-cell *matCellDef="let element"> {{element.budget | number}} </td>
            </ng-container>

            <ng-container matColumnDef="interests">
                <th mat-header-cell *matHeaderCellDef> ความสนใจ </th>
                <td mat-cell *matCellDef="let element">
                <mat-chip-set>
                    <mat-chip *ngFor="let interest of element.interests" style="background-color: #fff8e8; color: #b45309; font-size: 12px;">
                    {{interest}}
                    </mat-chip>
                </mat-chip-set>
                </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> สถานะ </th>
                <td mat-cell *matCellDef="let element"> 
                <span style="padding: 4px 8px; border-radius: 12px; font-size: 12px; background: #eaf4ff; color: #1f6feb;">
                    {{element.status}}
                </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> จัดการ </th>
                <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" title="ดูรายละเอียด/เปลี่ยนสถานะ">
                    <mat-icon>edit</mat-icon>
                </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
