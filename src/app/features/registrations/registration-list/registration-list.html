<div class="registration-list-container">

    <div class="registration-list-header">
        <h2 class="registration-list-title">รายชื่อผู้สมัครเข้าร่วมทริป</h2>

        <button mat-flat-button color="primary" routerLink="/registrations/new">
            <mat-icon>person_add</mat-icon> สร้างใบสมัคร
        </button>
    </div>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
        <mat-spinner diameter="50" color="primary"></mat-spinner>
        <p>กำลังโหลดข้อมูลผู้สมัคร...</p>
    </div>

    <div class="registration-list-table-container" *ngIf="!isLoading">
        <table mat-table [dataSource]="dataSource" class="registration-list-table">
            <ng-container matColumnDef="travelerName">
                <th mat-header-cell *matHeaderCellDef> ชื่อผู้สมัคร </th>
                <td mat-cell *matCellDef="let element"> <strong>{{element.travelerName}}</strong> </td>
            </ng-container>

            <ng-container matColumnDef="tripId">
                <th mat-header-cell *matHeaderCellDef> รหัสทริป </th>
                <td mat-cell *matCellDef="let element"> ทริป #{{element.tripId}} </td>
            </ng-container>

            <ng-container matColumnDef="budget">
                <th mat-header-cell *matHeaderCellDef> งบประมาณ (บาท) </th>
                <td mat-cell *matCellDef="let element"> {{element.budget | number}} </td>
            </ng-container>

            <ng-container matColumnDef="interests">
                <th mat-header-cell *matHeaderCellDef> ความสนใจ </th>
                <td mat-cell *matCellDef="let element">
                    <mat-chip-set>
                        <mat-chip *ngFor="let interest of element.interests" class="registration-list-chip">
                            {{interest}}
                        </mat-chip>
                    </mat-chip-set>
                </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> สถานะ </th>
                <td mat-cell *matCellDef="let element">
                    <span class="status-badge status-{{ element.status?.toLowerCase() }}">
                        {{element.status}}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> จัดการ </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="primary" title="ดูรายละเอียด/เปลี่ยนสถานะ">
                        <mat-icon>edit</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
