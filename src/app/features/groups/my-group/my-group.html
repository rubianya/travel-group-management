<div class="my-group-container">
  
  <div class="my-group-header">
    <h2 class="my-group-title">กลุ่มของฉัน</h2>
  </div>

  <div *ngIf="isLoading" class="my-group-loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>กำลังโหลดข้อมูลกลุ่ม...</p>
  </div>

  <div *ngIf="!isLoading && groups.length === 0" class="my-group-empty">
    <mat-icon class="my-group-empty-icon">group_off</mat-icon>
    <p>คุณยังไม่มีกลุ่มในขณะนี้<br>โปรดรอผู้จัดกลุ่มทำการจัดกลุ่ม</p>
  </div>

  <div *ngIf="!isLoading && groups.length > 0" class="my-group-grid">
    <mat-card *ngFor="let group of groups" class="my-group-card">
      <mat-card-header class="my-group-card-header">
        <mat-card-title class="my-group-card-title">
          {{ group.groupName }} (รหัสทริป: {{ group.tripId }})
        </mat-card-title>
        <mat-card-subtitle class="my-group-card-subtitle">
          <mat-icon class="my-group-person-icon">person</mat-icon> 
          เพื่อนร่วมกลุ่ม {{ group.members.length }} คน
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content class="my-group-card-content">
        <div *ngFor="let member of group.members" class="my-group-member-item">
          <div class="my-group-member-name">
            {{ member.travelerName }}
          </div>
          <mat-chip-set>
            <mat-chip *ngFor="let interest of member.interests" class="my-group-chip">
              {{ interest }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

</div>
