<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="group-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>ชื่อกลุ่ม</mat-label>
      <input matInput formControlName="groupName" placeholder="เช่น กลุ่มสนุกสนาน">
      <mat-error *ngIf="form.get('groupName')?.hasError('required')">
        กรุณาระบุชื่อกลุ่ม
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>หมายเหตุ</mat-label>
      <textarea matInput formControlName="note" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" *ngIf="data.members && data.members.length > 0">
      <mat-label>เลือกหัวหน้ากลุ่ม</mat-label>
      <mat-select formControlName="leaderId">
        <mat-option *ngFor="let member of data.members" [value]="member.userId">
          {{ member.userName || member.travelerName }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('leaderId')?.hasError('required')">
        กรุณาเลือกหัวหน้ากลุ่ม
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">ยกเลิก</button>
  <button mat-flat-button color="primary" (click)="onSave()" [disabled]="form.invalid">บันทึก</button>
</mat-dialog-actions>
