<div class="group-list-container" style="padding: 24px;">
  
  <!-- ส่วนหัวข้อและปุ่มจัดกลุ่ม -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
    <h2 style="margin: 0;">จัดการกลุ่มท่องเที่ยว (Trip #{{currentTripId}})</h2>
    
    <!-- ปุ่มจัดกลุ่มอัตโนมัติ (จะกดไม่ได้ถ้าระบบกำลังโหลดอยู่) -->
    <button mat-flat-button (click)="autoGroup()" [disabled]="isLoading" style="background-color: #0f766e; color: white;">
      <mat-icon>auto_awesome</mat-icon> จัดกลุ่มอัตโนมัติ
    </button>
  </div>

  <!-- 1. สถานะ Loading (แสดงตอนกำลังจัดกลุ่ม) -->
  <div *ngIf="isLoading" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;">
    <mat-spinner diameter="40"></mat-spinner>
    <p style="margin-top: 16px; color: #627d98;">กำลังวิเคราะห์ความสนใจและจัดกลุ่ม... กรุณารอสักครู่</p>
  </div>

  <!-- 2. แสดงข้อความเมื่อยังไม่มีกลุ่ม -->
  <div *ngIf="!isLoading && groups.length === 0" style="text-align: center; padding: 40px; background: white; border-radius: 8px; border: 1px dashed #d9e2ec;">
    <mat-icon style="font-size: 48px; width: 48px; height: 48px; color: #d9e2ec;">groups</mat-icon>
    <p style="color: #627d98; margin-top: 16px;">ยังไม่มีการจัดกลุ่มสำหรับทริปนี้<br>คลิกปุ่ม "จัดกลุ่มอัตโนมัติ" เพื่อเริ่มต้น</p>
  </div>

  <!-- 3. ส่วนแสดงการ์ดกลุ่ม (ใช้ CSS Grid) -->
  <div *ngIf="!isLoading && groups.length > 0" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
    
    <!-- วนลูปสร้าง Card ตามจำนวนกลุ่ม -->
    <mat-card *ngFor="let group of groups" style="border-radius: 12px; box-shadow: 0 4px 12px rgba(16, 42, 67, 0.05);">
      
      <!-- หัวการ์ด: ชื่อกลุ่ม และ จำนวนสมาชิก -->
      <mat-card-header style="background: #f5f8fb; padding: 16px; border-bottom: 1px solid #d9e2ec; border-radius: 12px 12px 0 0;">
        <mat-card-title style="font-size: 1.1rem; color: #102a43; margin: 0;">
          {{ group.groupName }}
        </mat-card-title>
        <mat-card-subtitle style="margin-top: 6px;">
          <mat-icon style="font-size: 16px; width: 16px; height: 16px; vertical-align: middle;">person</mat-icon> 
          สมาชิก {{ group.members.length }} คน
        </mat-card-subtitle>
      </mat-card-header>

      <!-- เนื้อหาการ์ด: รายชื่อสมาชิกและความสนใจ -->
      <mat-card-content style="padding: 16px;">
        <div *ngFor="let member of group.members" style="padding: 12px 0; border-bottom: 1px dashed #d9e2ec;">
          <div style="font-weight: 600; color: #243b53; margin-bottom: 8px;">
            {{ member.travelerName }}
          </div>
          <!-- แสดงความสนใจของสมาชิกแต่ละคน -->
          <mat-chip-set>
            <mat-chip *ngFor="let interest of member.interests" style="background-color: #eaf4ff; color: #1f6feb; font-size: 11px; min-height: 24px;">
              {{ interest }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </mat-card-content>
      
      <!-- ส่วนล่างของการ์ด (สำหรับเมนูแก้ไขเพิ่มเติมในอนาคต) -->
      <mat-card-actions style="padding: 12px 16px; justify-content: flex-end;">
        <button mat-button color="primary">ย้ายสมาชิก</button>
      </mat-card-actions>

    </mat-card>

  </div>
</div>
