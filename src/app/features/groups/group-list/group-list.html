<div class="group-list-container">
  
  <!-- ส่วนหัวข้อและปุ่มจัดกลุ่ม -->
  <div class="group-list-header">
    <h2 class="group-list-title">จัดการกลุ่มท่องเที่ยว (Trip #{{currentTripId}})</h2>
    
    <!-- ปุ่มจัดกลุ่มอัตโนมัติ (จะกดไม่ได้ถ้าระบบกำลังโหลดอยู่) -->
    <button mat-flat-button (click)="autoGroup()" [disabled]="isLoading" class="group-list-auto-btn">
      <mat-icon>auto_awesome</mat-icon> จัดกลุ่มอัตโนมัติ
    </button>
  </div>

  <!-- 1. สถานะ Loading (แสดงตอนกำลังจัดกลุ่ม) -->
  <div *ngIf="isLoading" class="group-list-loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="group-list-loading-text">กำลังวิเคราะห์ความสนใจและจัดกลุ่ม... กรุณารอสักครู่</p>
  </div>

  <!-- 2. แสดงข้อความเมื่อยังไม่มีกลุ่ม -->
  <div *ngIf="!isLoading && groups.length === 0" class="group-list-empty">
    <mat-icon class="group-list-empty-icon">groups</mat-icon>
    <p class="group-list-empty-text">ยังไม่มีการจัดกลุ่มสำหรับทริปนี้<br>คลิกปุ่ม "จัดกลุ่มอัตโนมัติ" เพื่อเริ่มต้น</p>
  </div>

  <!-- 3. ส่วนแสดงการ์ดกลุ่ม (ใช้ CSS Grid) -->
  <div *ngIf="!isLoading && groups.length > 0" class="group-list-grid">
    
    <!-- วนลูปสร้าง Card ตามจำนวนกลุ่ม -->
    <mat-card *ngFor="let group of groups" class="group-list-card">
      
      <!-- หัวการ์ด: ชื่อกลุ่ม และ จำนวนสมาชิก -->
      <mat-card-header class="group-list-card-header">
        <mat-card-title class="group-list-card-title">
          {{ group.groupName }}
        </mat-card-title>
        <mat-card-subtitle class="group-list-card-subtitle">
          <mat-icon class="group-list-person-icon">person</mat-icon> 
          สมาชิก {{ group.members.length }} คน
        </mat-card-subtitle>
      </mat-card-header>

      <!-- เนื้อหาการ์ด: รายชื่อสมาชิกและความสนใจ -->
      <mat-card-content class="group-list-card-content">
        <div *ngFor="let member of group.members" class="group-list-member-item">
          <div class="group-list-member-name">
            {{ member.travelerName }}
          </div>
          <!-- แสดงความสนใจของสมาชิกแต่ละคน -->
          <mat-chip-set>
            <mat-chip *ngFor="let interest of member.interests" class="group-list-chip">
              {{ interest }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </mat-card-content>
      
      <!-- ส่วนล่างของการ์ด (สำหรับเมนูแก้ไขเพิ่มเติมในอนาคต) -->
      <mat-card-actions class="group-list-card-actions">
        <button mat-button color="primary">ย้ายสมาชิก</button>
      </mat-card-actions>

    </mat-card>

  </div>
</div>
