<mat-sidenav-container class="layout">

    <mat-sidenav
        [mode]="layout.sidenavMode()"
        [opened]="layout.isSidebarOpen()"
    >
        <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content>
        <app-navbar></app-navbar>
        <div class="page">
            <router-outlet></router-outlet>
        </div>
        <app-footer></app-footer>
    </mat-sidenav-content>

</mat-sidenav-container>
